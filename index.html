function setForm(el){const s=S.set,F=[['owner','मालिक','Malik'],['phone','फ़ोन (+91...)','Phone (+91...)'],['wa','WhatsApp (918957400266)','WhatsApp (918957400266)'],['address','दुकान का पता / बाज़ार','Dukaan Ka Pata / Bazaar'],['area','गाँव / एरिया','Gaon / Area'],['district','ज़िला','Zila'],['state','राज्य','Rajya'],['pin','पिन कोड','PIN Code'],['lat','Latitude','Latitude'],['lng','Longitude','Longitude'],['radius','फ्री डिलीवरी दायरा (KM)','Free Delivery Ka Daayra (KM)'],['tiers','डिलीवरी चार्ज "KM:₹" जैसे 7:20,10:40','Delivery charge "KM:₹" jaise 7:20,10:40'],['fallback','आख़िरी चार्ज (₹)','Aakhri Charge (₹)'],['maxKm','ज़्यादा से ज़्यादा डिलीवरी (KM)','Zyada Se Zyada Delivery (KM)'],['open','खुलने का समय','Khulne Ka Samay'],['close','बंद होने का समय','Band Hone Ka Samay']];
el.innerHTML=asw()+`<div class="card"><h3>${A('दुकान की सेटिंग','Dukaan Ki Setting')}</h3>${F.map(([k,h,l])=>`<label>${A(h,l)}</label><input data-k="${k}" value="${esc(s[k])}">`).join('')}<button class="o" id="gl" style="width:100%">📍 ${A('अभी की लोकेशन को दुकान की लोकेशन बनाएँ','Abhi ki location ko dukaan ki location banayein')}</button><br><br><button id="ss" style="width:100%">${A('सेव करें','Save Karein')}</button><br><button class="o" id="cx" style="width:100%">${A('वापस','Wapas')}</button></div>`;
$('#gl').onclick=()=>navigator.geolocation.getCurrentPosition(p=>{el.querySelector('[data-k=lat]').value=p.coords.latitude.toFixed(6);el.querySelector('[data-k=lng]').value=p.coords.longitude.toFixed(6)},()=>alert(t('denied')));
$('#cx').onclick=()=>{S.edit=null;render()};
$('#ss').onclick=async()=>{const v={};el.querySelectorAll('[data-k]').forEach(i=>v[i.dataset.k]=i.value.trim());const r=await sb.from('shop_settings').update({data:v,updated_at:new Date().toISOString()}).eq('id',1);if(r.error){alert(r.error.message);return}S.edit=null;await refresh()}}

/* ---- supabase data + owner login ---- */
const optTxt=a=>(a||[]).map(o=>`${o.l}=${o.p}=${o.a}`).join('\n');
const optArr=x=>String(x||'').split('\n').map(l=>l.split('=').map(y=>y.trim())).filter(a=>a[0]&&+a[1]>0).map(a=>({l:a[0],p:+a[1],a:+a[2]||1}));
const fromP=r=>({id:r.id,data:{name:r.name_hi||'',nameHl:r.name_hl||'',desc:r.desc_hi||'',descHl:r.desc_hl||'',cat:r.cat,price:+r.price,unit:r.unit,stock:+r.stock,min:+r.min_qty,max:+r.max_qty,disc:+r.discount,opts:optTxt(r.opts),avail:r.available,feat:r.featured,img:r.img||''}});
const toP=v=>({name_hi:v.name||null,name_hl:v.nameHl||null,cat:v.cat,price:v.price,unit:v.unit,stock:v.stock,min_qty:v.min,max_qty:v.max,discount:v.disc,opts:optArr(v.opts),desc_hi:v.desc||null,desc_hl:v.descHl||null,img:v.img||null,available:v.avail,featured:v.feat});
const fromO=r=>({id:r.code,uuid:r.id,cust:r.customer,loc:r.loc,km:+r.km,fee:+r.fee,sub:+r.subtotal,total:+r.total,status:r.status,t:Date.parse(r.created_at),items:r.items});
async function loadAll(){if(!sb)return;
const [a,b]=await Promise.all([sb.from('shop_settings').select('data').eq('id',1).maybeSingle(),sb.from('products').select('*').order('created_at')]);
if(a.data)S.set={...DEF,...a.data.data};if(b.data)S.prods=b.data.map(fromP);
if(S.admin){const c=await sb.from('orders').select('*').order('created_at',{ascending:false}).limit(200);if(c.data)S.orders=c.data.map(fromO)}}
const refresh=async()=>{await loadAll();render(1)};
async function checkAdmin(){S.admin=false;const {data}=await sb.auth.getSession();if(data.session){const r=await sb.rpc('is_admin');S.admin=r.data===true}S.unlocked=S.admin}
async function logout(){try{await sb.auth.signOut()}catch(e){}S.admin=false;S.unlocked=false;S.edit=null;S.orders=[];render()}
function login(el){el.innerHTML=`<div class="card"><h3>🔐 ${t('loginT')}</h3><p class="mut">${A('यह हिस्सा सिर्फ़ दुकान के मालिक रवि जी के लिए है। सिर्फ़ पासवर्ड डालें।','Yeh hissa sirf dukaan ke malik Ravi ji ke liye hai. Sirf password daalein.')}</p><label>${A('पासवर्ड','Password')}</label><input id="pw" type="password" autocomplete="current-password"><button id="ok" style="width:100%">${A('लॉगिन करें','Login Karein')}</button><button class="o" id="su" style="width:100%;margin-top:8px">${A('पहली बार? पासवर्ड बनाएँ','Pehli baar? Password Banayein')}</button><button class="o" data-v="shop" style="width:100%;margin-top:8px">${t('back')}</button></div>`;
const cred=()=>({email:OWNER_EMAIL,password:$('#pw').value});
const fin=async()=>{await checkAdmin();if(!S.admin){alert(A('यह खाता मालिक का नहीं है','Yeh account malik ka nahi hai'));await logout();return}await loadAll();render()};
$('#ok').onclick=async()=>{const r=await sb.auth.signInWithPassword(cred());if(r.error){alert(r.error.message);return}fin()};
$('#su').onclick=async()=>{const c=cred();if(c.password.length<8){alert(A('पासवर्ड कम से कम 8 अक्षर','Password kam se kam 8 akshar'));return}
const r=await sb.auth.signUp(c);if(r.error){alert(r.error.message);return}if(!r.data.session){alert(A('Supabase में "Confirm email" बंद करें, फिर दोबारा कोशिश करें।','Supabase mein "Confirm email" band karein, phir dobara koshish karein.'));return}
await sb.rpc('claim_admin');fin()}}
function pwForm(el){el.innerHTML=asw()+`<div class="card"><h3>🔑 ${A('पासवर्ड बदलें','Password Badlein')}</h3><input id="n1" type="password" autocomplete="new-password" placeholder="${A('नया पासवर्ड','Naya password')}"><input id="n2" type="password" autocomplete="new-password" placeholder="${A('नया दोबारा लिखें','Naya dobara likhein')}"><button id="ok" style="width:100%">${A('सेव करें','Save Karein')}</button><br><button class="o" id="cx" style="width:100%">${A('वापस','Wapas')}</button></div>`;
$('#cx').onclick=()=>{S.edit=null;render()};
$('#ok').onclick=async()=>{const n=$('#n1').value;if(n.length<8||n!==$('#n2').value){alert(A('कम से कम 8 अक्षर और दोनों एक जैसे हों','Kam se kam 8 akshar aur dono ek jaise hon'));return}const r=await sb.auth.updateUser({password:n});if(r.error){alert(r.error.message);return}S.edit=null;toast('✔');render()}}
document.addEventListener('click',e=>{if(e.target.closest('[data-lock]'))logout()});
let lastAct=Date.now();document.addEventListener('click',()=>lastAct=Date.now());
setInterval(()=>{if(S.admin&&Date.now()-lastAct>1800000)logout()},60000);
/* ---- init ---- */
render();
(async()=>{if(!sb){$('#app').insertAdjacentHTML('afterbegin',`<div class="card">${t('ofail')}</div>`);return}
try{await checkAdmin();await loadAll()}catch(e){}render(1);
setInterval(async()=>{if(document.hidden||S.edit||!['shop','admin','contact'].includes(S.view))return;if(document.activeElement&&document.activeElement.id==='q')return;try{await loadAll();render(1)}catch(e){}},60000);
})();
</script></body></html>
